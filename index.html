
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RecyclePoint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

  <div class="login-decoration login-decoration--top"></div>
  <div class="login-decoration login-decoration--bottom"></div>
  <div class="login-decoration login-decoration--orange"></div>

  <header class="login-header">
    <a href="index.html" class="login-brand">
      <img src="images/logo.png" alt="RecyclePoint">
    </a>
  </header>

  <main class="login-main">

    <section class="login-intro">
      <h1>Setor sampah,<br>panen poin.</h1>
      <p>Masuk kembali dan jadikan setiap setoranmu<br class="desktop-break"> lebih bernilai.</p>
    </section>

    <section class="login-card">
      <h2>Login</h2>

      <form onsubmit="window.location.href='dashboard.php'; return false;">

        <div class="login-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
          >
        </div>

        <div class="login-field">
          <label for="password">Kata Sandi</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="login-submit">Login</button>

        <p class="login-register">
          Belum punya akun?
          <a href="register.php">Register</a>
        </p>

      </form>
    </section>

  </main>

</body>
</html>
