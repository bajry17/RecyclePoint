<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RecyclePoint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-page">

    <div class="circle circle--top"></div>
    <div class="circle circle--bottom"></div>
    <div class="circle circle--orange"></div>

    <a href="index.html" class="login-brand">
      <img src="images/logo.png" alt="Logo RecyclePoint">
    </a>

    <section class="login-content">

      <div class="login-intro">
        <h1>Setor sampah,<br>panen poin.</h1>
        <p>
          Masuk kembali dan jadikan setiap setoranmu
          lebih bernilai.
        </p>
      </div>

      <div class="login-card">
        <h2>Login</h2>

        <form action="dashboard.php" method="get">

          <div class="login-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
            >
          </div>

          <div class="login-field">
            <label for="password">Kata Sandi</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            >
          </div>

          <button type="submit" class="login-button">
            Login
          </button>

        </form>

        <p class="login-register">
          Belum punya akun?
          <a href="register.php">Register</a>
        </p>
      </div>

    </section>
  </main>

</body>
</html>
